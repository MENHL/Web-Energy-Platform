# 生产环境配置：所有敏感信息与连接信息一律来自环境变量，绝不硬编码真实密钥
# 需要的环境变量：
#   GG_DB_URL       例如 jdbc:mysql://db:3306/greengrid_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
#   GG_DB_USERNAME  数据库账号
#   GG_DB_PASSWORD  数据库密码
#   GG_JWT_SECRET   JWT 签名密钥（>= 32 字节随机串）
#   GG_JWT_EXPIRE_MINUTES  可选，默认 120

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${GG_DB_URL}
    username: ${GG_DB_USERNAME}
    password: ${GG_DB_PASSWORD}
    hikari:
      pool-name: GreenGridHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # 生产不做自动建表/初始化，改用 Flyway 或手工执行 schema.sql（后续阶段接入）
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

greengrid:
  jwt:
    secret: ${GG_JWT_SECRET}
    expire-minutes: ${GG_JWT_EXPIRE_MINUTES:120}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
