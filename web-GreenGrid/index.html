<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GreenGrid 新能源企业运营数据可视化平台" />
  <title>GreenGrid 新能源运营平台</title>

  <!-- GitHub Pages 兜底：还原因 404.html 透传过来的原始路由 -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search)
      var route = params.get('p')
      if (!route) return
      params.delete('p')
      var rest = params.toString()
      /* 用 history.replaceState 还原 SPA 路由，避免刷新丢失 */
      window.history.replaceState(null, '', route + (rest ? '?' + rest : ''))
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
