# GreenGrid 前端 + 后端 Nginx 配置
# 场景：前端 dist 静态资源 + /api 反向代理到后端（后端 context-path 为 /api，因此不要 rewrite）
# 若 Nginx 与后端同处 docker compose 网络，后端主机名为 backend；
# 若 Nginx 部署在宿主机，把 backend 改成 localhost。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------- 前端站点 ----------
    server {
        listen       80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        # SPA History 路由 fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源长缓存
        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # 后端 API 反向代理（不 rewrite，转发原始 /api 前缀）
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
